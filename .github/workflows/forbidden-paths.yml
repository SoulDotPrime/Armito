name: Validate forbidden paths

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  forbidden-paths:
    name: Reject changes in restricted documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject restricted paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' path; do
            if [[ "$path" =~ ^Docs/(FIRMWARE|AUDI)(/|$) ]]; then
              printf 'Forbidden path changed: %q\n' "$path"
              failed=1
            fi
          done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")

          if [[ "$failed" -ne 0 ]]; then
            echo "Changes under Docs/FIRMWARE/ or Docs/AUDI/ are not allowed."
            exit 1
          fi
